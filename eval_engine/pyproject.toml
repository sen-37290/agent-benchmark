[project]
name = "agent-benchmark"
version = "0.1.0"
description = "Deterministic, extensible benchmark evaluation engine"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
swebench = [
  "harbor==0.20.0",
  "mini-swe-agent==2.4.5",
  "swebench==4.0.3",
]
terminalbench = [
  "harbor==0.21.0",
  "mini-swe-agent==2.4.5",
]

[project.scripts]
agent-bench = "agent_benchmark.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.uv.sources]
harbor = [
  { git = "https://github.com/friendliai/harbor.git", rev = "d0bcab5bc8c04963cc00a4d293aba40db54fe9bc", marker = "extra == 'terminalbench'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
