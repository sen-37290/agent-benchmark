[project]
name = "agent-benchmark"
version = "0.1.0"
description = "Deterministic, extensible benchmark evaluation engine"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
# LiteLLM is a DIRECT dependency of ours -- `harnesses/streaming_completion.py`,
# `openai_fallback.py` and `anthropic_fallback.py` import it and wrap its internals -- but until
# now it was only ever satisfied transitively: harbor and mini-swe-agent both require it with NO
# version constraint, so the resolver picked whatever was current when the lock was written. That
# was 1.94.0, in which `reasoning_effort="max"` is SILENTLY DROPPED on the way to the Responses
# API: `_map_reasoning_effort()` has no `max` branch and returns None, and the caller in
# `responses/main.py` pops the parameter unconditionally, so no `reasoning` field reaches the
# provider at all. Every gpt-5.6 SWE-bench run therefore asked for `max` and was served `medium`
# -- 72,188 of 72,188 stored responses echo `"effort": "medium"`. See BerriAI/litellm#38084;
# fixed by a73f11ae9c (PR #38222), first released in 1.100.0. Pinned exactly, like the agents
# below, so the effort a run actually gets is a property of the lock and not of the day it was
# resolved.
swebench = [
  "harbor==0.20.0",
  "litellm==1.100.0",
  "mini-swe-agent==2.4.5",
  "swebench==4.0.3",
]
terminalbench = [
  "harbor==0.21.0",
  "litellm==1.100.0",
  "mini-swe-agent==2.4.5",
]

[project.scripts]
agent-bench = "agent_benchmark.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.uv.sources]
harbor = [
  { git = "https://github.com/friendliai/harbor.git", rev = "d0bcab5bc8c04963cc00a4d293aba40db54fe9bc", marker = "extra == 'terminalbench'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
