  # A re-run of the 24 Terminal-Bench tasks the fable run lost to infrastructure, not to the
  # model: 14 to credit exhaustion, 5 to an input-token rate limit, 5 to API connection timeouts.
  #
  # COST GUARDRAILS ARE THE POINT OF THIS ROW. The original run had no per-task cap (the profile
  # shipped enforce_per_task_cost_limit: false) and no experiment cap, and one task reached
  # $5,019 on its own. Both caps are on here, and both are enforced independently:
  #   per_task_cap_usd  -- inside the Harbor process, by harbor_cost_guard; stops that one task.
  #   experiment_cap_usd -- outside, from completed trial costs; stops dispatching new tasks.
  # Only 8 workers, not the usual 12: the outer cap can only see FINISHED trials, so concurrency
  # is what the run can overshoot it by.
  - label: sen-fable-5-1-terminal-bench-retry-24
    vm: sen-fable-5-1-failed-cases-terminal-bench
    benchmark: terminal-bench-2.1
    model: fable-5-1
    reasoning_effort: max
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_TERMINAL_BENCH_RETRY_24_CASES
    experiment_cap_usd: 600
    no_budget_limit: false  # experiment cap ENABLED, unlike the run this replaces
    per_task_cap_usd: 20
    workers: 8

