  # not failed-case patches, and each runs on the dedicated VM with the same name as its label.
  #
  # The official SWE profile retains its locked $3/task cap and supplies error_retries: 3. The
  # experiment cap is disabled, matching the intended-max cohort; no task may start until prepare
  # has pre-pulled the complete generation/grading image set.
  - label: sen-gpt-5-6-sol-swe-bench-litellm-fix-max
