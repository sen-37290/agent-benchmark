# The ten concurrent experiments: one per VM, one API key each.
#
# This file is the single source of truth shared by deploy_experiment.sh, run_experiment.sh and
# the fleet monitor. `label` is the join key: it names the experiment, prefixes the run ID, names
# the systemd unit, and is what you pass to every fleet command.
#
# Only official pipelines are used:
#   swebench-verified   mini-swe-agent (native) + the official hermetic SWE-bench grader
#   terminal-bench-2.1  Harbor + Terminus 2
#   cybergym-300-level1 OpenHands + the CyberGym submission server
#
# `api_key_from` names the environment variable holding that experiment's key. The subject agent
# still receives the canonical provider variable; see `--api-key-from`.
#
# Worker counts follow what these VM classes have already sustained: 30 for SWE-bench and 20 for
# CyberGym (both proven on previous full runs), 12 for Terminal-Bench, whose Docker-per-task
# footprint is heavier on a 32-vCPU box.

defaults:
  project: gcp-test-501403
  zone: us-central1-a
  # Where the controller checkout and its runs live on each VM.
  remote_root: /home/friendli/agent-benchmark
  ssh_user: friendli

experiments:
  # ---- SWE-bench Verified (500 tasks, official mini-swe-agent + official grader) ----
  - label: sen-gpt-5-6-sol-swe-bench
    vm: sen-agent-bench-vm
    benchmark: swebench-verified
    model: gpt-5-6-sol
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_SWE_BENCH
    experiment_cap_usd: 500
    workers: 30
    # per-task cap comes from the benchmark profile and is locked at the official $3.

  - label: sen-gpt-5-6-terra-swe-bench
    vm: sen-gpt-5-6-terra-swe-bench
    benchmark: swebench-verified
    model: gpt-5-6-terra
    provider: openai
    api_key_from: SEN_GPT_5_6_TERRA_SWE_BENCH
    experiment_cap_usd: 500
    workers: 30

  - label: sen-gpt-5-6-luna-swe-bench
    vm: sen-gpt-5-6-luna-swe-bench
    benchmark: swebench-verified
    model: gpt-5-6-luna
    provider: openai
    api_key_from: SEN_GPT_5_6_LUNA_SWE_BENCH
    experiment_cap_usd: 500
    workers: 30

  - label: sen-fable-5-1-swe-bench
    vm: sen-fable-5-1-swe-bench
    benchmark: swebench-verified
    model: fable-5-1
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_SWE_BENCH
    experiment_cap_usd: 500
    workers: 30

  # ---- Terminal-Bench 2.1 (89 tasks, Harbor + Terminus 2) ----
  - label: sen-gpt-5-6-sol-terminal-bench
    vm: sen-gpt-5-6-sol-terminal-bench
    benchmark: terminal-bench-2.1
    model: gpt-5-6-sol
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_TERMINAL_BENCH
    experiment_cap_usd: 500
    per_task_cap_usd: 5
    workers: 12

  - label: sen-gpt-5-6-terra-terminal-bench
    vm: sen-gpt-5-6-terra-terminal-bench
    benchmark: terminal-bench-2.1
    model: gpt-5-6-terra
    provider: openai
    api_key_from: SEN_GPT_5_6_TERRA_TERMINAL_BENCH
    experiment_cap_usd: 500
    per_task_cap_usd: 5
    workers: 12

  - label: sen-gpt-5-6-luna-terminal-bench
    vm: sen-gpt-5-6-luna-terminal-bench
    benchmark: terminal-bench-2.1
    model: gpt-5-6-luna
    provider: openai
    api_key_from: SEN_GPT_5_6_LUNA_TERMINAL_BENCH
    experiment_cap_usd: 500
    per_task_cap_usd: 5
    workers: 12

  - label: sen-fable-5-1-terminal-bench
    vm: sen-fable-5-1-terminal-bench
    benchmark: terminal-bench-2.1
    model: fable-5-1
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_TERMINAL_BENCH
    experiment_cap_usd: 500
    per_task_cap_usd: 5
    workers: 12

  # ---- CyberGym (300 tasks, OpenHands). Both VMs already hold the 175G data cache and
  # the canary/smoke gates, so prepare is a no-op there. ----
  - label: sen-gpt-5-6-sol-cybergym-bench
    vm: sen-agent-cyber-bench-vm
    benchmark: cybergym-300-level1
    # CyberGym paused: both gpt-5.6 AND gpt-5.5 hit OpenAI cyber_policy on ~80% of tasks mid-run.
    model: gpt-5-6-sol
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_CYBERGYM_BENCH
    experiment_cap_usd: 5000
    per_task_cap_usd: 50
    workers: 20

  - label: sen-fable-5-1-cybergym-bench
    vm: sen-agent-cyber-bench-vm-2
    benchmark: cybergym-300-level1
    model: fable-5-1
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_CYBERGYM_BENCH
    experiment_cap_usd: 5000
    per_task_cap_usd: 50
    workers: 20
