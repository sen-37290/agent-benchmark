  # RuntimeError) and eight never started, one of those on credit exhaustion -- $106.71 was
  # already spent producing nothing, and no source run holds a usable attempt for any of them.
  #
  # Everything that broke them before is addressed here: no per-task cap and no experiment cap
  # (the four CostLimitExceeded tasks were working when the cap cut them off), no agent deadline,
  # server-side fallback for refusals, and the streaming transport -- the six RuntimeError tasks
  # are plausibly the same silent-socket failure that wedged the previous two runs, which
  # streaming fixed. See harnesses/streaming_completion.
  #
  # 12 workers is the concurrency this 32-vCPU class has sustained; 18 at once has not been
  # tried. With no cost ceiling anywhere, 12 tasks in flight spend roughly $180-300/hour, so
  # this run needs watching rather than leaving overnight.
  - label: sen-fable-5-1-streaming-terminal-bench-gap-18
    vm: sen-agent-cyber-bench-vm-2
    benchmark: terminal-bench-2.1
    model: fable-5-1
    reasoning_effort: max
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_REMOVE_COST_LIMIT_TERMINAL_BENCH_RETRY_10
    anthropic_fallbacks: default
    pin_file: pins/sen-fable-5-1-streaming-terminal-bench-gap-18.json
    no_timeout: true
    experiment_cap_usd: 100000
    no_budget_limit: true
    per_task_cap_usd: 100000
