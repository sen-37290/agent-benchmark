# Fleet experiments: one active experiment per VM and one API key per experiment.
#
# This file is the single source of truth shared by deploy_experiment.sh, run_experiment.sh and
# the fleet monitor. `label` is the join key: it names the experiment, prefixes the run ID, names
# the systemd unit, and is what you pass to every fleet command.
#
# Only official pipelines are used:
#   swebench-verified   mini-swe-agent (native) + the official hermetic SWE-bench grader
#   terminal-bench-2.1  Harbor + Terminus 2
#   cybergym-300-level1 OpenHands + the CyberGym submission server
#
# `api_key_from` names the environment variable holding that experiment's key. The subject agent
# still receives the canonical provider variable; see `--api-key-from`.
#
# Worker counts follow what these VM classes have already sustained: 30 for SWE-bench and 20 for
# CyberGym (both proven on previous full runs), 12 for Terminal-Bench, whose Docker-per-task
# footprint is heavier on a 32-vCPU box.

defaults:
  project: gcp-test-501403
  zone: us-central1-a
  # Where the controller checkout and its runs live on each VM.
  remote_root: /home/friendli/agent-benchmark
  ssh_user: friendli

experiments:
  # ---- SWE-bench Verified (500 tasks, official mini-swe-agent + official grader) ----
  - label: sen-gpt-5-6-sol-swe-bench
    vm: sen-agent-bench-vm
    benchmark: swebench-verified
    model: gpt-5-6-sol
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_SWE_BENCH
    experiment_cap_usd: 500
    no_budget_limit: true  # experiment cap disabled; per-task cap still applies
    workers: 30
    # per-task cap comes from the benchmark profile and is locked at the official $3.

  - label: sen-gpt-5-6-terra-swe-bench
    vm: sen-gpt-5-6-terra-swe-bench
    benchmark: swebench-verified
    model: gpt-5-6-terra
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_TERRA_SWE_BENCH
    experiment_cap_usd: 500
    no_budget_limit: true  # experiment cap disabled; per-task cap still applies
    workers: 30

  - label: sen-gpt-5-6-luna-swe-bench
    vm: sen-gpt-5-6-luna-swe-bench
    benchmark: swebench-verified
    model: gpt-5-6-luna
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_LUNA_SWE_BENCH
    experiment_cap_usd: 500
    no_budget_limit: true  # experiment cap disabled; per-task cap still applies
    workers: 30

  # ---- SWE-bench Verified: full replacement of the 20260903 GPT runs after the LiteLLM fix. --
  #
  # The earlier rows requested `max`, but LiteLLM 1.94.0 silently removed that one effort value
  # while translating Responses-API requests. Every one of the 72,188 archived responses echoed
  # `medium`. LiteLLM 1.100.0 carries the upstream fix. These are complete 500-task replacements,
  # not failed-case patches, and each runs on the dedicated VM with the same name as its label.
  #
  # The official SWE profile retains its locked $3/task cap and supplies error_retries: 3. The
  # experiment cap is disabled, matching the intended-max cohort; no task may start until prepare
  # has pre-pulled the complete generation/grading image set.
  - label: sen-gpt-5-6-sol-swe-bench-litellm-fix-max
    vm: sen-gpt-5-6-sol-swe-bench-litellm-fix-max
    benchmark: swebench-verified
    model: gpt-5-6-sol
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_SWE_BENCH_LITELLM_FIX_MAX
    required_litellm_version: 1.100.0
    strict_swe_image_gate: true
    verify_responses_effort: true
    experiment_cap_usd: 500
    no_budget_limit: true
    workers: 30

  - label: sen-gpt-5-6-terra-swe-bench-litellm-fix-max
    vm: sen-gpt-5-6-terra-swe-bench-litellm-fix-max
    benchmark: swebench-verified
    model: gpt-5-6-terra
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_TERRA_SWE_BENCH_LITELLM_FIX_MAX
    required_litellm_version: 1.100.0
    strict_swe_image_gate: true
    verify_responses_effort: true
    experiment_cap_usd: 500
    no_budget_limit: true
    workers: 30

  - label: sen-gpt-5-6-luna-swe-bench-litellm-fix-max
    vm: sen-gpt-5-6-luna-swe-bench-litellm-fix-max
    benchmark: swebench-verified
    model: gpt-5-6-luna
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_LUNA_SWE_BENCH_LITELLM_FIX_MAX
    required_litellm_version: 1.100.0
    strict_swe_image_gate: true
    verify_responses_effort: true
    experiment_cap_usd: 500
    no_budget_limit: true
    workers: 30

  - label: sen-fable-5-1-swe-bench
    vm: sen-fable-5-1-swe-bench
    benchmark: swebench-verified
    model: fable-5-1
    reasoning_effort: max
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_SWE_BENCH
    experiment_cap_usd: 500
    no_budget_limit: true  # experiment cap disabled; per-task cap still applies
    workers: 30

  # ---- Terminal-Bench 2.1 (89 tasks, Harbor + Terminus 2) ----
  - label: sen-gpt-5-6-sol-terminal-bench
    vm: sen-gpt-5-6-sol-terminal-bench
    benchmark: terminal-bench-2.1
    model: gpt-5-6-sol
    reasoning_effort: xhigh
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_TERMINAL_BENCH
    experiment_cap_usd: 500
    no_budget_limit: true  # experiment cap disabled; per-task cap still applies
    workers: 12

  - label: sen-gpt-5-6-terra-terminal-bench
    vm: sen-gpt-5-6-terra-terminal-bench
    benchmark: terminal-bench-2.1
    model: gpt-5-6-terra
    reasoning_effort: xhigh
    provider: openai
    api_key_from: SEN_GPT_5_6_TERRA_TERMINAL_BENCH
    experiment_cap_usd: 500
    no_budget_limit: true  # experiment cap disabled; per-task cap still applies
    workers: 12

  - label: sen-gpt-5-6-luna-terminal-bench
    vm: sen-gpt-5-6-luna-terminal-bench
    benchmark: terminal-bench-2.1
    model: gpt-5-6-luna
    reasoning_effort: xhigh
    provider: openai
    api_key_from: SEN_GPT_5_6_LUNA_TERMINAL_BENCH
    experiment_cap_usd: 500
    no_budget_limit: true  # experiment cap disabled; per-task cap still applies
    workers: 12

  - label: sen-fable-5-1-terminal-bench
    vm: sen-fable-5-1-terminal-bench
    benchmark: terminal-bench-2.1
    model: fable-5-1
    reasoning_effort: max
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_TERMINAL_BENCH
    experiment_cap_usd: 500
    no_budget_limit: true  # experiment cap disabled; per-task cap still applies
    workers: 12

  # A re-run of the 24 Terminal-Bench tasks the fable run lost to infrastructure, not to the
  # model: 14 to credit exhaustion, 5 to an input-token rate limit, 5 to API connection timeouts.
  #
  # COST GUARDRAILS ARE THE POINT OF THIS ROW. The original run had no per-task cap (the profile
  # shipped enforce_per_task_cost_limit: false) and no experiment cap, and one task reached
  # $5,019 on its own. Both caps are on here, and both are enforced independently:
  #   per_task_cap_usd  -- inside the Harbor process, by harbor_cost_guard; stops that one task.
  #   experiment_cap_usd -- outside, from completed trial costs; stops dispatching new tasks.
  # Only 8 workers, not the usual 12: the outer cap can only see FINISHED trials, so concurrency
  # is what the run can overshoot it by.
  - label: sen-fable-5-1-terminal-bench-retry-24
    vm: sen-fable-5-1-failed-cases-terminal-bench
    benchmark: terminal-bench-2.1
    model: fable-5-1
    reasoning_effort: max
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_TERMINAL_BENCH_RETRY_24_CASES
    experiment_cap_usd: 600
    no_budget_limit: false  # experiment cap ENABLED, unlike the run this replaces
    per_task_cap_usd: 20
    workers: 8

  # ---- CyberGym (300 tasks, OpenHands). Both VMs already hold the 175G data cache and
  # the canary/smoke gates, so prepare is a no-op there. ----
  - label: sen-gpt-5-6-sol-cybergym-bench
    vm: sen-agent-cyber-bench-vm
    benchmark: cybergym-300-level1
    # CyberGym paused: both gpt-5.6 AND gpt-5.5 hit OpenAI cyber_policy on ~80% of tasks mid-run.
    model: gpt-5-6-sol
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_CYBERGYM_BENCH
    experiment_cap_usd: 5000
    per_task_cap_usd: 50
    workers: 20

  - label: sen-fable-5-1-cybergym-bench
    vm: sen-agent-cyber-bench-vm-2
    benchmark: cybergym-300-level1
    model: fable-5-1
    provider: anthropic
    api_key_from: SEN_FABLE_5_1_CYBERGYM_BENCH
    experiment_cap_usd: 5000
    per_task_cap_usd: 50
    workers: 20

  # ---- Terminal-Bench 2.1 at reasoning_effort=max, over the Responses API ----
  #
  # Chat completions rejects `max` outright (HTTP 400 unsupported_value), so these are the first
  # Terminal-Bench runs able to request it at all. The benchmark profile now sets
  # `use_responses_api` and `stream_llm_calls`; `verify_responses_effort` makes the controller
  # prove the provider echoes `max` before it creates a run, and Harbor records the echo again
  # per call in llm_stream.jsonl. All three share one VM through separate concurrent targets.
  - label: sen-gpt-5-6-sol-terminal-bench-responses-max
    vm: sen-agent-bench-vm
    backup_target: terminal-responses-sol
    benchmark: terminal-bench-2.1
    model: gpt-5-6-sol
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_SWE_BENCH_LITELLM_FIX_MAX
    required_litellm_version: 1.100.0
    verify_responses_effort: true
    openai_fallbacks: ["openai/gpt-5.6-sol", "openai/gpt-5.6-sol", "openai/gpt-5.6-terra", "openai/gpt-5.6-luna"]
    experiment_cap_usd: 60
    workers: 4

  - label: sen-gpt-5-6-terra-terminal-bench-responses-max
    vm: sen-agent-bench-vm
    backup_target: terminal-responses-terra
    benchmark: terminal-bench-2.1
    model: gpt-5-6-terra
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_TERRA_SWE_BENCH_LITELLM_FIX_MAX
    required_litellm_version: 1.100.0
    verify_responses_effort: true
    experiment_cap_usd: 60
    workers: 4

  - label: sen-gpt-5-6-luna-terminal-bench-responses-max
    vm: sen-agent-bench-vm
    backup_target: terminal-responses-luna
    benchmark: terminal-bench-2.1
    model: gpt-5-6-luna
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_LUNA_SWE_BENCH_LITELLM_FIX_MAX
    required_litellm_version: 1.100.0
    verify_responses_effort: true
    experiment_cap_usd: 60
    workers: 4

  # ---- Terminal-Bench 2.1, full 89, reasoning_effort=max over the Responses API ----
  #
  # The first Terminal-Bench runs able to request `max` at all: chat completions rejects it with
  # HTTP 400 unsupported_value, so the earlier gpt-5.6 runs were capped at xhigh by the endpoint.
  # The benchmark profile supplies `use_responses_api` (applied only to openai models) and
  # `stream_llm_calls`; `verify_responses_effort` makes the controller prove the provider echoes
  # `max` before a run is created, and Harbor records that echo again per call in
  # llm_stream.jsonl. One dedicated VM per snapshot, each with its own key.
  #
  # `no_timeout` because a max-effort turn is long -- single calls over 6,000 reasoning tokens --
  # and a task cut off at the agent deadline can score 0 with a passing verifier. The $20 per-task
  # cap from the profile is then the bound on any one task, and the $1,500 experiment cap is
  # enforced (not disabled) as the bound on the run.
  #
  # Only sol carries the refusal ladder. gpt-5.6 refuses break-filter-js-from-html and
  # vulnerable-secret with a cyber_policy 400; on terra and luna a refusal is left to fail so
  # their scores are purely their own.
  - label: sen-gpt-5-6-sol-terminal-bench-response-api-max
    vm: sen-gpt-5-6-sol-terminal-bench-response-api-max
    benchmark: terminal-bench-2.1
    model: gpt-5-6-sol
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_SOL_TERMINAL_BENCH_RESPONSE_API_MAX
    required_litellm_version: 1.100.0
    verify_responses_effort: true
    openai_fallbacks: ["openai/gpt-5.6-sol", "openai/gpt-5.6-sol", "openai/gpt-5.6-terra", "openai/gpt-5.6-luna"]
    experiment_cap_usd: 1500
    no_timeout: true
    workers: 12

  - label: sen-gpt-5-6-terra-terminal-bench-response-api-max
    vm: sen-gpt-5-6-terra-terminal-bench-response-api-max
    benchmark: terminal-bench-2.1
    model: gpt-5-6-terra
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_TERRA_TERMINAL_BENCH_RESPONSE_API_MAX
    required_litellm_version: 1.100.0
    verify_responses_effort: true
    experiment_cap_usd: 1500
    no_timeout: true
    workers: 12

  - label: sen-gpt-5-6-luna-terminal-bench-response-api-max
    vm: sen-gpt-5-6-luna-terminal-bench-response-api-max
    benchmark: terminal-bench-2.1
    model: gpt-5-6-luna
    reasoning_effort: max
    provider: openai
    api_key_from: SEN_GPT_5_6_LUNA_TERMINAL_BENCH_RESPONSE_API_MAX
    required_litellm_version: 1.100.0
    verify_responses_effort: true
    experiment_cap_usd: 1500
    no_timeout: true
    workers: 12
