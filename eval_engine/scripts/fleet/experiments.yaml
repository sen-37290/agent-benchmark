  # ---- SWE-bench Verified: the 18 matplotlib tasks terra and luna lost to a container-start
  # timeout, replayed on a pre-warmed image cache. ---------------------------------------------
  #
  # WHAT WENT WRONG. mini-swe-agent starts each task with `docker run <image>` and wraps that
  # call in `subprocess.run(..., timeout=pull_timeout)`, pull_timeout defaulting to 120s. The
  # image is pulled implicitly by that same call, so at 30 workers ~30 first-touch pulls race;
  # the matplotlib images are the largest in the dataset and a wave of them never lands inside
  # 120s. All 18 died with TimeoutExpired before the model was ever called -- $0.00 spent, no
  # trajectory -- and all four retry attempts replayed the identical herd. gpt-5.6-sol escaped
  # only because its VM held a warm image cache from an earlier run; it lost nothing and is
  # therefore NOT re-run here.
  #
  # THE FIX IS IN prepare, NOT IN THE ROW. `agent-bench prepare` now pre-pulls every image in the
  # pool, four at a time, before any task starts, and the harness raises pull_timeout 120 -> 1800
  # so a later cache miss costs time instead of costing the task. The official grader resolves
  # the same `swebench/sweb.eval.x86_64.<id>:latest` reference, so one pre-pull warms grading too.
  #
  # WHY $20 AND WHY IT CHANGES NOTHING. The cap is raised for consistency with the fable re-run
  # that follows, and it is inert here: the most expensive gpt-5.6 task ever measured was sol at
  # $1.158, terra peaked at $0.479 and luna at $0.051, and no gpt-5.6 task in 1,500 trials ever
  # exited LimitsExceeded. So these 18 remain directly comparable with the 464 already scored at
  # the official $3, and merge into the archived runs without an asterisk. SWE-bench Verified
  # locks its per-task cap, so the departure must be declared: allow_cost_limit_override.
  #
  # ONE VM, TWO EXPERIMENTS, IN SEQUENCE. A VM carries one launch.env and one controller, so
  # these cannot run at the same time. Deploy terra, let it finish, then deploy luna -- which is
  # the better order anyway, because luna reuses the image cache terra's prepare pulls.
  - label: sen-gpt-5-6-terra-swe-bench-docker-timeout
    vm: sen-gpt-5-6-docker-timeout-swe-bench
    benchmark: swebench-verified
    model: gpt-5-6-terra
    reasoning_effort: max      # matches the run being repaired; do not "upgrade" it
    provider: openai
    api_key_from: SEN_GPT_5_6_TERRA_SWE_BENCH_DOCKER_TIMEOUT
    pin_file: pins/sen-gpt-5-6-terra-swe-bench-docker-timeout.json  # 18 tasks
    per_task_cap_usd: 20
    allow_cost_limit_override: true   # departs from the locked official $3, on purpose
    experiment_cap_usd: 50
    no_budget_limit: false
    # One worker per task: the whole subset runs in a single wave, and with the images already
    # local there is no pull to serialise. Well under the 30 this VM class has sustained.
    workers: 18

  - label: sen-gpt-5-6-luna-swe-bench-docker-timeout
    vm: sen-gpt-5-6-docker-timeout-swe-bench
    benchmark: swebench-verified
    model: gpt-5-6-luna
    reasoning_effort: max
