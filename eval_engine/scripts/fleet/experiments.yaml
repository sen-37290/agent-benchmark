  # The 8 tasks fable-5-1 has NO verdict for in any run. They are not failures: every one crashed
  # before the verifier ran -- four on RuntimeError, three on BadRequestError, and
  # break-filter-js-from-html was never in the fallback-to-opus run's 24. Whether fable passes
  # them is simply unmeasured, and they are the entire distance between the headline 86.5% (they
  # count as failures) and the 95.5% ceiling (they all pass). On the 81 tasks that do have a
  # verdict, fable is at 95.1%.
  #
  # Supersedes the gap-18 pin, which redid the 10 tasks that already have max-effort verdicts in
  # 20260905T010914Z-...-fallback-to-opus-...-881450e4; that run was stopped after 70 calls.
  #
  # Fallback stays ON and its answers COUNT: fable refuses some of these outright, the fallback
  # model is part of the system under test, and 32% of the fallback-to-opus run's responses were
  # served by opus-4-8/opus-5. The ledger fix shipped this morning means this run records which
  # model served each response in logs/anthropic_fallback.jsonl, so the split is reportable
  # rather than something to reconstruct from trajectory strings later.
  - label: sen-fable-5-1-streaming-terminal-bench-gap-8
