name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: eval_engine/uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Install lint dependencies
        working-directory: eval_engine
        run: uv sync --group dev

      - name: Run lint
        run: make lint
